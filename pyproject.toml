[project]
name = "genai-agent-mastery"
version = "0.1.0"
description = "Production-grade GenAI agent build track on GCP (ADK/Gemini Enterprise Agent Platform)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Sujith Vemishetty"}]
dependencies = [
    "google-adk==2.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["^infra/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
